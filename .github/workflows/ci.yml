name: gooo-incremental-module-compiler-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Prepare caller-owned outputs
        run: mkdir -p "$RUNNER_TEMP/gooo-imc/conformance" "$RUNNER_TEMP/gooo-imc/compile" "$RUNNER_TEMP/gooo-imc/generated-build"
      - name: Enforce Go formatting
        run: test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './.git/*'))"
      - name: Build compiler
        run: |
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-imc/build.rss" go build -o "$RUNNER_TEMP/gooo-imc/compiler" ./cmd/gooo-incremental-module-compiler
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-imc/build.rss")" > "$RUNNER_TEMP/gooo-imc/build.time"
      - name: Run Go tests
        run: |
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-imc/test.rss" sh -c 'go test -json -count=1 ./... > "$RUNNER_TEMP/gooo-imc/go-test.json"'
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-imc/test.rss")" > "$RUNNER_TEMP/gooo-imc/test.time"
      - name: Run Go vet
        run: go vet ./...
      - name: Compile one closed scenario
        run: |
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-imc/compile.rss" "$RUNNER_TEMP/gooo-imc/compiler" compile \
            -policy .gooo/incremental-compiler.gooo \
            -input-dir fixtures/conformance/leaf-change \
            -scenario fixtures/conformance/leaf-change/scenario.json \
            -output "$RUNNER_TEMP/gooo-imc/compile"
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-imc/compile.rss")" > "$RUNNER_TEMP/gooo-imc/compile.time"
      - name: Execute five-case conformance
        run: |
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-imc/conformance.rss" "$RUNNER_TEMP/gooo-imc/compiler" conformance \
            -policy .gooo/incremental-compiler.gooo \
            -manifest .gooo/conformance.gooo \
            -root . \
            -output "$RUNNER_TEMP/gooo-imc/conformance"
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-imc/conformance.rss")" > "$RUNNER_TEMP/gooo-imc/conformance.time"
      - name: Build every generated Go artifact
        run: |
          start=$(date +%s%3N)
          for source in "$RUNNER_TEMP"/gooo-imc/conformance/generated/*.go; do
            name=$(basename "$source" .go)
            dir="$RUNNER_TEMP/gooo-imc/generated-build/$name"
            mkdir -p "$dir"
            cp "$source" "$dir/main.go"
            printf 'module generated-%s\n\ngo 1.27.0\n' "$name" > "$dir/go.mod"
            (cd "$dir" && go build .)
          done
          end=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-imc/integration.rss" true
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-imc/integration.rss")" > "$RUNNER_TEMP/gooo-imc/integration.time"
      - name: Write exact CI evidence
        if: always()
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-evidence.sh" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gooo-imc/conformance" "$RUNNER_TEMP/gooo-imc/ci-evidence.json" \
            "$RUNNER_TEMP/gooo-imc/compile.time" "$RUNNER_TEMP/gooo-imc/build.time" "$RUNNER_TEMP/gooo-imc/test.time" \
            "$RUNNER_TEMP/gooo-imc/conformance.time" "$RUNNER_TEMP/gooo-imc/integration.time" \
            "$RUNNER_TEMP/gooo-imc/conformance/conformance.json"
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-incremental-module-compiler-evidence
          path: |
            ${{ runner.temp }}/gooo-imc/ci-evidence.json
            ${{ runner.temp }}/gooo-imc/conformance/*.json
            ${{ runner.temp }}/gooo-imc/conformance/generated/*.go
            ${{ runner.temp }}/gooo-imc/go-test.json
          if-no-files-found: error
